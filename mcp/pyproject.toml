[project]
name = "pypandoc-hwpx-mcp"
version = "0.1.0"
description = "MCP server for pypandoc-hwpx: convert DOCX, HTML, and Markdown files to HWPX format"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.26.0",
    "pillow>=12.1.1",
    "pypandoc>=1.17",
]

[project.scripts]
pypandoc-hwpx-mcp = "server:main"
